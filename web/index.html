<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#1a1a2e;color:white;min-height:100vh}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold}
.btn-blue{background:#007bff;color:white}.btn-green{background:#28a745;color:white}.btn-orange{background:#ff9800;color:black}.btn-gray{background:#555;color:white}.btn-red{background:#dc3545;color:white}
.topbar{background:#0a0a1e;padding:15px 20px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.topbar h1{font-size:22px}.topbar input{padding:10px;border-radius:6px;border:1px solid #555;background:#2a2a4a;color:white;font-size:14px}
.tabs{background:#1a1a3e;padding:10px 20px;display:flex;gap:5px}
.tabs button{padding:12px 20px;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:bold;background:#007bff;color:white}
.tabs button.active{background:#ff9800;color:#000}
.content{padding:20px;max-width:1200px;margin:0 auto}
.theme-block{background:#2a2a4a;padding:15px;margin:12px 0;border-radius:10px}
.q-item{background:#111133;padding:12px;margin:8px 0;border-radius:8px;border-left:4px solid #ff9800}
.q-price{font-size:20px;font-weight:bold;color:#ff9800}
.q-row{display:flex;gap:10px;align-items:center;margin:4px 0}
.q-row label{width:25px;color:#aaa;font-size:13px}
.q-row input[type=text]{flex:1;padding:10px;border-radius:5px;border:1px solid #555;background:#1a1a3e;color:white;font-size:15px}
.preview{max-width:200px;max-height:120px;margin:8px;border-radius:8px;border:3px solid #ff9800;display:block}
.drop-zone{border:2px dashed #555;padding:12px 15px;border-radius:8px;text-align:center;color:#888;font-size:13px;cursor:pointer;min-height:40px;display:flex;align-items:center;justify-content:center}
.drop-zone:hover,.drop-zone.dragover{border-color:#ff9800;color:#ff9800;background:#1a1a3e}
.drop-zone.has-file{border-color:#28a745;color:#28a745}
.actions{padding:20px;display:flex;gap:10px}
.final-item{background:#2a2a4a;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #ff9800}

/* GAME SCREEN */
#game-screen{display:none;flex-direction:column;height:100vh}
.game-header{background:#0a0a1e;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.game-header h2{font-size:22px}
.players-row{display:flex;gap:10px;padding:10px 20px;background:#1a1a3e;flex-wrap:wrap}
.player-badge{background:#2a2a4a;padding:10px 15px;border-radius:8px;text-align:center;min-width:80px}
.player-badge .pname{font-size:14px}
.player-badge .pscore{font-size:22px;font-weight:bold}
.pscore.plus{color:#28a745}.pscore.minus{color:#dc3545}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.board-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:1000px;width:100%}
.bcell{background:#007bff;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:center;min-height:65px;padding:10px;text-align:center}
.bcell:hover{background:#0056b3}
.bcell.used{background:#333;cursor:default;color:#666}
.bcell.used:hover{background:#333}
.bcell.selected{background:#ff9800;animation:pulse 1s infinite}
.bcell.head{background:#ff9800;cursor:default;font-size:13px}
.bcell.head:hover{background:#ff9800}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.ctrl-bar{background:#1a1a3e;padding:15px 20px;display:flex;align-items:center;gap:10px;min-height:70px}
.ctrl-bar .answer-name{font-size:24px;font-weight:bold;color:#ff9800;flex:1;text-align:center}

/* OVERLAY */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:1000}
.overlay-box{background:#1a1a2e;padding:40px;border-radius:20px;text-align:center;max-width:650px;width:90%}
.overlay-box h2{color:#ff9800;font-size:36px;margin-bottom:10px}
.overlay-box .big-price{font-size:56px;font-weight:bold;color:#28a745;margin:15px 0}
.overlay-box .q-text{font-size:26px;margin:20px 0;line-height:1.4}
.overlay-box img{max-width:400px;max-height:300px;border-radius:10px;margin:10px 0}
.overlay-box audio{width:100%;margin:10px 0}
/* Общая первая картинка: есть на start и drafts */
.screen-with-background {
  min-height: 100vh;
  box-sizing: border-box;

  background-image: url('web/assets/background_start.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* Только стартовый экран */
#start-screen {
  position: relative;
  overflow: hidden;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  min-height: 100vh;
  padding: 40px 20px;
  box-sizing: border-box;
}
.start-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;

  transform: translateY(50px);
}
/* Вторая картинка: только на start-screen */
#start-screen::before {
  content: "";
  position: absolute;
  inset: 0;

  background-image: url('web/assets/text_main.png'); /* Укажите ваш путь */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  pointer-events: none;
  z-index: 0;
}

/* Кнопки и содержимое находятся выше overlay */
#start-screen > * {
  position: relative;
  z-index: 1;
}

/* Второй экран — список черновиков */
/* Экран «Мои черновики» */
#drafts-screen {
  display: none;
  position: relative;
  min-height: 100vh;
  padding: 70px 30px 40px;
  box-sizing: border-box;

  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  color: #25213b;
}

/* Заголовок */
#drafts-screen h2 {
  margin: 0 0 28px;
  color: #25213b;
  font-size: 34px;
  font-weight: 700;
}

/* Сетка: четыре карточки в одном ряду */
#drafts-list {
  display: grid;
  grid-template-columns: repeat(4, minmax(150px, 1fr));
  gap: 18px;

  width: min(960px, 100%);
  margin: 0 auto;
}

/* Карточка черновика */
.draft-card {
  min-height: 120px;
  padding: 16px;

  border: 3px solid #25213b;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.92);

  color: #25213b;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  overflow-wrap: anywhere;

  cursor: pointer;
  box-shadow: 0 4px 8px rgba(37, 33, 59, 0.30);
  transition: transform 0.15s ease, box-shadow 0.15s ease,
              background-color 0.15s ease;
}

.draft-card:hover {
  transform: translateY(-4px);
  background: #ffffff;
  box-shadow: 0 8px 16px rgba(37, 33, 59, 0.38);
}

/* Кнопка-крестик справа сверху */
.drafts-close {
  position: absolute;
  top: 22px;
  right: 25px;

  width: 44px;
  height: 44px;
  padding: 0;

  border: 3px solid #25213b;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.92);

  color: #25213b;
  font-size: 32px;
  font-weight: 400;
  line-height: 36px;
  text-align: center;

  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.15s ease;
}

.drafts-close:hover {
  transform: rotate(90deg);
  background: #ffffff;
}

/* Текст «Черновиков нет» */
.empty-drafts {
  grid-column: 1 / -1;
  margin: 0;
  color: #25213b;
  font-size: 18px;
  font-weight: 700;
  text-align: center;
}

/* Адаптация для узких экранов */
@media (max-width: 800px) {
  #drafts-list {
    grid-template-columns: repeat(2, minmax(140px, 1fr));
    width: min(540px, 100%);
  }
}

@media (max-width: 420px) {
  #drafts-screen {
    padding: 75px 16px 30px;
  }

  #drafts-list {
    grid-template-columns: 1fr;
  }

  .drafts-close {
    top: 14px;
    right: 16px;
  }

  /* ===== РЕДАКТОР: светлый дизайн ===== */

:root {
  --editor-bg: #fff8ed;
  --sidebar-bg: #eee4f7;
  --ink: #20203a;
  --mint: #abe7d0;
  --mint-dark: #167d5d;
  --peach: #ffcdb8;
  --coral: #f78376;
  --paper: #fffdf9;
  --line: #25233d;
}

#editor-screen {
  min-height: 100vh;
  background: var(--editor-bg);
  color: var(--ink);
  font-family: Arial, sans-serif;
}

#editor-screen .actions {
  padding-bottom: 35px;
}

#editor-screen .editor-sidebar .tabs {
  position: static;

  margin-top: 24px;
  padding: 0 3px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: transparent;
}

#editor-screen .editor-sidebar .tabs button {
  min-height: 58px;
  padding: 12px 16px;
  border: 2px solid #25233d;
  border-radius: 16px;
  background: #fffdf9;
  color: #20203a;
  box-shadow: 0 3px 0 #25233d;
  cursor: pointer;
  font-family: inherit;
  font-size: 20px;
  font-weight: 900;
  text-align: left;
  transition: transform .12s ease, box-shadow .12s ease;
}

#editor-screen .editor-sidebar .tabs button:hover {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #25233d;
}

#editor-screen .editor-sidebar .tabs button.active {
  background: #abe7d0;
  color: #167d5d;
  border-color: #167d5d;
  box-shadow: 0 3px 0 #167d5d;
}


#editor-screen::before {
  content: "Своя игра\A\A ПЛЮС ВАЙБ\A\A ЗАПОЛНЕНО 20 ИЗ 70\A\A Раунды\A\A\A\A\A\A\A\A\A\A\A\A\A\A\A\A\A\A\A\A\A\A Посмотреть игру";
  white-space: pre-wrap;
  position: fixed;
  z-index: 10;
  top: 0;
  left: 100px;
  width: 300px;
  height: 100vh;
  box-sizing: border-box;
  padding: 30px 35px;
  background: var(--sidebar-bg);
  color: var(--ink);
  font-weight: 800;
  font-size: 18px;
  line-height: 1.35;
  pointer-events: none;
}

#editor-screen::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9;
  width: 100px;
  height: 100vh;
  background: var(--editor-bg);
  pointer-events: none;
}

#editor-screen .content {
  position: relative;
  z-index: 1;
  max-width: none;
  min-height: calc(100vh - 80px);
  margin: 44px 36px 40px 437px;
  padding: 44px;
  border: 2px solid var(--line);
  border-radius: 24px;
  background: var(--paper);
  box-shadow: 0 7px 0 var(--line);
}

#editor-screen .theme-block,
#editor-screen .final-item {
  margin: 0 0 28px;
  padding: 26px;
  border: 2px solid var(--line);
  border-radius: 18px;
  background: #fff9ef;
}

#editor-screen .theme-block > input[type="text"],
#editor-screen .final-item > input[type="text"] {
  width: min(440px, 100%);
  box-sizing: border-box;
  margin: 0 0 22px;
  padding: 16px 22px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: #fffaf0;
  color: var(--ink);
  font-size: 25px !important;
  font-weight: 800 !important;
}

#editor-screen .q-item {
  margin: 16px 0;

  border: 2px solid var(--line);
  border-left: 12px solid var(--mint-dark);
  border-radius: 14px;
  background: var(--paper);
}

#editor-screen .q-price {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 80px;
  margin-bottom: 14px;
  padding: 8px 13px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--peach);
  color: var(--ink);
  font-size: 25px;
  font-weight: 900;
}

#editor-screen .q-row {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  margin: 12px 0;
}

#editor-screen .q-row label {
  width: auto;
  color: var(--mint-dark);
  font-size: 20px;
  font-weight: 900;
}

#editor-screen .q-row input[type="text"] {
  width: 100%;

  padding: 13px 15px;
  border: 2px solid var(--line);
  border-radius: 10px;
  background: #fffdf8;
  color: var(--ink);
  font-size: 16px;
}

#editor-screen .drop-zone {
  min-height: 50px;
  padding: 12px 15px;
  border: 2px dashed var(--mint-dark);
  border-radius: 12px;
  background: #effbf5;
  color: var(--mint-dark);
  font-size: 14px;
  font-weight: 700;
}

#editor-screen .drop-zone:hover,
#editor-screen .drop-zone.dragover {
  border-color: var(--coral);
  background: #fff0ea;
  color: #bd4f45;
}

#editor-screen .drop-zone.has-file {
  border-style: solid;
  border-color: var(--mint-dark);
  color: var(--mint-dark);
}

#editor-screen .preview {
  max-width: 220px;
  max-height: 140px;
  margin: 10px 0 0 44px;
  border: 2px solid var(--line);
  border-radius: 12px;
}

#editor-screen .actions {
  position: relative;
  z-index: 2;
  margin: 0 36px 35px 437px;
  padding: 0 44px;
  display: flex;
  justify-content: flex-end;
  gap: 26px;
  background: transparent;
}

#editor-screen .btn {
  min-width: 180px;
  padding: 13px 28px;
  border: 2px solid var(--line);
  border-radius: 13px;
  box-shadow: 0 5px 0 var(--line);
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: transform .12s ease, box-shadow .12s ease;
}

#editor-screen .btn:hover {
  transform: translateY(2px);
  box-shadow: 0 3px 0 var(--line);
}

#editor-screen .btn-orange,
#editor-screen .btn-red {
  background: var(--coral);
  color: var(--ink);
}

#editor-screen .btn-blue,
#editor-screen .btn-green {
  background: var(--mint);
  color: var(--mint-dark);
}

#editor-screen .btn-gray {
  background: #fffdf9;
  color: var(--ink);
}

@media (max-width: 980px) {
  #editor-screen::before,
  #editor-screen::after {
    display: none;
  #editor-screen .editor-sidebar {
  position: static;
  width: 100%;
  height: auto;
  padding: 22px 18px;
}

#editor-screen .sidebar-actions {
  margin-top: 25px;
}

#editor-screen .sidebar-brand {
  font-size: 34px;
}
  }

  #editor-screen .tabs {
    position: static;
    width: auto;
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    background: var(--sidebar-bg);
  }

  #editor-screen .tabs button {
    min-height: 58px;
    font-size: 18px;
    text-align: center;
  }

  #editor-screen .content {
    margin: 20px;
    padding: 22px;
  }

  #editor-screen .actions {
    margin: 0 20px 25px;
    padding: 0;
    justify-content: center;
    flex-wrap: wrap;
  }
}

@media (max-width: 560px) {
  #editor-screen .tabs {
    grid-template-columns: 1fr;
  }

  #editor-screen .content {
    margin: 12px;
    padding: 14px;
  }

  #editor-screen .theme-block,
  #editor-screen .final-item,
  #editor-screen .q-item {
    padding: 14px;
  }

  #editor-screen .q-row {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  #editor-screen .btn {
    width: 100%;
  }
}

/* === Новый дизайн окна вопроса === */
#overlay.question-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 42px 24px;
  box-sizing: border-box;
  background: #fff9ee;
  isolation: isolate;
}

#overlay.question-overlay::before,
#overlay.question-overlay::after {
  content: "";
  position: fixed;
  z-index: -1;
  border-radius: 50%;
  pointer-events: none;
}

#overlay.question-overlay::before {
  width: 310px;
  height: 310px;
  left: -78px;
  bottom: -72px;
  background: #d9f5df;
}

#overlay.question-overlay::after {
  width: 270px;
  height: 270px;
  right: -64px;
  top: 180px;
  background: #eee4f8;
}

.question-overlay .overlay-box.question-card {
  width: min(1220px, calc(100vw - 36px));
  max-width: 1220px;
  min-height: min(620px, calc(100vh - 36px));
  max-height: calc(100vh - 36px);
  padding: 30px 64px 26px;
  min-height: 600px;
  box-sizing: border-box;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  border: 3px solid #303047;
  border-radius: 26px;
  background: #ffffff;
  color: #17172b;
  box-shadow: 0 7px 0 #55536a, 0 12px 22px rgba(43, 42, 66, 0.15);
  text-align: center;
}

.question-overlay .overlay-box.question-card::after {
  content: "✦";
  position: fixed;
  top: 46px;
  right: 95px;
  color: #f2a09c;
  font-family: Arial, sans-serif;
  font-size: 88px;
  line-height: 1;
  pointer-events: none;
}

.question-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: min(470px, 100%);
  box-sizing: border-box;
  min-height: 68px;
  margin: 0 0 26px;
  padding: 13px 28px;
  border: 2px solid #303047;
  border-radius: 18px;
  background: #fff9ee;
  color: #24243c;
  font-size: clamp(22px, 2.5vw, 34px);
  font-weight: 800;
  line-height: 1.15;
}

.question-overlay #ov-text.q-text {
  width: 100%;
  margin: 0 0 22px;
  color: #090914;
  font-size: clamp(25px, 3vw, 38px);
  font-weight: 800;
  line-height: 1.18;
}

.question-overlay #ov-media {
  display: flex;
  width: 100%;
  justify-content: center;
  align-items: center;
  margin: 0 0 22px;
}

.question-overlay #ov-media img {
  display: block;
  max-width: min(100%, 440px) !important;
  max-height: 310px !important;
  border-radius: 12px !important;
  object-fit: contain;
}

.question-overlay #ov-media audio {
  width: min(100%, 440px) !important;
}

.question-overlay #ov-answerer {
  margin: 0 0 18px !important;
  color: #ef8a39 !important;
  font-size: 24px !important;
}

.question-overlay #ov-btns {
  display: flex;
  width: 100%;
  justify-content: center;
  gap: 18px !important;
  flex-wrap: wrap;
  margin-top: auto;
}

.question-overlay .question-action,
.question-overlay .question-close {
  min-width: 226px;
  padding: 15px 24px !important;
  border: 2px solid #303047 !important;
  border-radius: 18px !important;
  box-shadow: 0 5px 0 #303047 !important;
  color: #25243b !important;
  font-size: 18px !important;
  font-weight: 800 !important;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transform: translateY(0);
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
}

.question-overlay .question-action:hover,
.question-overlay .question-close:hover {
  filter: brightness(0.98);
  transform: translateY(2px);
  box-shadow: 0 3px 0 #303047 !important;
}

.question-overlay .question-action:active,
.question-overlay .question-close:active {
  transform: translateY(5px);
  box-shadow: none !important;
}

.question-overlay .question-activate,
.question-overlay .question-show-answer {
  background: #ffe38f !important;
}

.question-overlay .question-correct {
  background: #bdebd2 !important;
}

.question-overlay .question-wrong,

  background: #f7b0aa !important;
}

<script>
var T,prices=[[100,200,300,400,500],[200,400,600,800,1000],[300,600,900,1200,1500]],currentRound=0,roomCode,playerId,joined=false;
var lastCorrectPlayerName = 'Ведущий';
var selectedPlayerIndex = -1; // Индекс выбранного игрока
var keyboardMode = false; // Режим ввода с клавиатуры
window._showScoreMessage = false;
window._scoreMessageHTML = '';
window._scoreMessageTimeout = null;
window._selectionTimeout = null;

function showEditor(){document.getElementById('start-screen').style.display='none';document.getElementById('editor-screen').style.display='block'}
function showStartScreen() {
  document.getElementById('start-screen').style.display = 'flex';
}
function backToStart() {
  document.getElementById('editor-screen').style.display = 'none';
  showStartScreen();
  window.ws = null;
}

function backFromDrafts() {
  document.getElementById('drafts-screen').style.display = 'none';
  showStartScreen();
}
window.ws=null;
function initTemplate(){T={rounds:[],final:[],name:'My Game'};for(var r=0;r<3;r++){var cats=[];for(var c=0;c<5;c++){var qs=[];for(var q=0;q<5;q++)qs.push({price:prices[r][q],text:'',answer:'',qmedia:'',amedia:''});cats.push({name:'Theme '+(c+1),questions:qs})}T.rounds.push({name:'Round '+(r+1),categories:cats})}for(var i=0;i<10;i++)T.final.push({name:'Theme '+(i+1),text:'',answer:'',qmedia:'',amedia:''})}
initTemplate();document.addEventListener("click",function(e){var c=e.target.closest(".bcell");if(!c)return;var cat=c.getAttribute("data-cat");var price=c.getAttribute("data-price");var ex=c.getAttribute("data-exists");var sel=c.getAttribute("data-sel");if(cat&&price&&ex==="1"&&sel==="0"){window.ws.send(JSON.stringify({type:"select_question",category:cat,price:parseInt(price)}))}});document.addEventListener("click",function(e){var c=e.target.closest(".bcell");if(!c)return;var cat=c.getAttribute("data-cat");var price=c.getAttribute("data-price");var ex=c.getAttribute("data-exists");var sel=c.getAttribute("data-sel");if(cat&&price&&ex==="1"&&sel==="0"){window.ws.send(JSON.stringify({type:"select_question",category:cat,price:parseInt(price)}))}});switchRound(0);

function switchRound(idx){currentRound=idx;var btns=document.querySelectorAll('#tabs button');btns.forEach(function(b,i){b.classList.remove('active');if(i===idx)b.classList.add('active')});renderRound(idx)}
function renderRound(idx){
  var h='';
  if(idx<3){
    var round=T.rounds[idx];
    for(var c=0;c<round.categories.length;c++){
      var cat=round.categories[c];
      h+='<div class="theme-block"><input type="text" placeholder="Theme name" value="'+cat.name+'" onchange="T.rounds['+idx+'].categories['+c+'].name=this.value" style="font-weight:bold;font-size:16px;width:300px">';
      for(var q=0;q<cat.questions.length;q++){
        var qq=cat.questions[q];
        var isFilled = (qq.text && qq.text.trim() !== '') && (qq.answer && qq.answer.trim() !== '');
        h+='<div class="q-item' + (isFilled ? ' filled' : '') + '"><div class="q-price">'+qq.price+'</div>';
        h+='<div class="q-row"><label>Q:</label><input type="text" placeholder="Question" value="'+esc(qq.text)+'" oninput="T.rounds['+idx+'].categories['+c+'].questions['+q+'].text=this.value;updateQItemHighlight(this)"></div>';
        h+='<div class="q-row"><label></label><div class="drop-zone" onclick="this.nextElementSibling.click()" ondrop="dropRound(event,'+idx+','+c+','+q+',\'q\',this)" ondragover="dragOver(event)" ondragleave="dragLeave(event)">'+(qq.qmedia?'File loaded':'Drop or click')+'</div><input type="file" style="display:none" onchange="upRound('+idx+','+c+','+q+',\'q\',this)">';
        if(qq.qmedia)h+='<img class="preview" src="'+qq.qmedia+'">';
        h+='</div>';
        h+='<div class="q-row"><label>A:</label><input type="text" placeholder="Answer" value="'+esc(qq.answer)+'" oninput="T.rounds['+idx+'].categories['+c+'].questions['+q+'].answer=this.value;updateQItemHighlight(this)"></div>';
        h+='<div class="q-row"><label></label><div class="drop-zone" onclick="this.nextElementSibling.click()" ondrop="dropRound(event,'+idx+','+c+','+q+',\'a\',this)" ondragover="dragOver(event)" ondragleave="dragLeave(event)">'+(qq.amedia?'File loaded':'Drop or click')+'</div><input type="file" style="display:none" onchange="upRound('+idx+','+c+','+q+',\'a\',this)">';
        if(qq.amedia)h+='<img class="preview" src="'+qq.amedia+'">';
        h+='</div></div>';
      }
      h+='</div>';
    }
  } else {
    for(var i=0;i<T.final.length;i++){
      var f=T.final[i];
      var isFinalFilled = (f.text && f.text.trim() !== '') && (f.answer && f.answer.trim() !== '');
      h+='<div class="final-item' + (isFinalFilled ? ' filled' : '') + '">';
      h+='<input type="text" placeholder="Theme name" value="'+esc(f.name||'Theme '+(i+1))+'" onchange="T.final['+i+'].name=this.value" style="font-weight:bold;font-size:16px;width:300px"><br>';
      h+='<div class="q-row"><label>Q:</label><input type="text" placeholder="Question" value="'+esc(f.text)+'" oninput="T.final['+i+'].text=this.value;updateQItemHighlight(this)"></div>';
      h+='<div class="q-row"><label></label><div class="drop-zone" onclick="this.nextElementSibling.click()" ondrop="dropFinal(event,'+i+',\'q\',this)" ondragover="dragOver(event)" ondragleave="dragLeave(event)">'+(f.qmedia?'File loaded':'Drop or click')+'</div><input type="file" style="display:none" onchange="upFinal('+i+',\'q\',this)">';
      if(f.qmedia)h+='<img class="preview" src="'+f.qmedia+'">';
      h+='</div>';
      h+='<div class="q-row"><label>A:</label><input type="text" placeholder="Answer" value="'+esc(f.answer)+'" oninput="T.final['+i+'].answer=this.value;updateQItemHighlight(this)"></div>';
      h+='<div class="q-row"><label></label><div class="drop-zone" onclick="this.nextElementSibling.click()" ondrop="dropFinal(event,'+i+',\'a\',this)" ondragover="dragOver(event)" ondragleave="dragLeave(event)">'+(f.amedia?'File loaded':'Drop or click')+'</div><input type="file" style="display:none" onchange="upFinal('+i+',\'a\',this)">';
      if(f.amedia)h+='<img class="preview" src="'+f.amedia+'">';
      h+='</div></div>';
    }
}
  document.getElementById('editor').innerHTML=h;
}
function updateQItemHighlight(input) {
    var container = input.closest('.q-item, .final-item');
    if (!container) return;

    var textInput = container.querySelector('input[placeholder="Question"]');
    var answerInput = container.querySelector('input[placeholder="Answer"]');

    if (textInput && answerInput) {
        var isFilled = textInput.value.trim() !== '' && answerInput.value.trim() !== '';
        if (isFilled) {
            container.classList.add('filled');
        } else {
            container.classList.remove('filled');
        }
    }
}
function esc(s){return s.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escapeFinalHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
function dragOver(e){e.preventDefault();e.target.classList.add('dragover')}
function dragLeave(e){e.target.classList.remove('dragover')}
function dropRound(e,r,c,q,type,zone){e.preventDefault();zone.classList.remove('dragover');var f=e.dataTransfer.files[0];if(!f)return;var inp=zone.nextElementSibling;var dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;upRound(r,c,q,type,inp)}
function dropFinal(e,i,type,zone){e.preventDefault();zone.classList.remove('dragover');var f=e.dataTransfer.files[0];if(!f)return;var inp=zone.nextElementSibling;var dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;upFinal(i,type,inp)}
var activeDZ=null;document.addEventListener('mouseover',function(e){if(e.target.classList.contains('drop-zone'))activeDZ=e.target});document.addEventListener('paste',function(e){if(!activeDZ)return;var items=e.clipboardData.items;if(!items)return;for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')>=0||items[i].type.indexOf('audio')>=0){var f=items[i].getAsFile();var inp=activeDZ.nextElementSibling;if(inp&&inp.type==='file'){var dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;inp.dispatchEvent(new Event('change'));activeDZ.textContent='File loaded';activeDZ.classList.add('has-file')}e.preventDefault();break}}});

async function upRound(r,c,q,type,input){var file=input.files[0];if(!file)return;var dz=input.previousElementSibling;dz.textContent='Uploading...';var fd=new FormData();fd.append('file',file);var resp=await fetch('/api/upload',{method:'POST',body:fd});var d=await resp.json();if(type==='q'){T.rounds[r].categories[c].questions[q].qmedia=d.url;T.rounds[r].categories[c].questions[q].qmediatype=file.type.startsWith('audio/')?'audio':'image'}else{T.rounds[r].categories[c].questions[q].amedia=d.url;T.rounds[r].categories[c].questions[q].amediatype=file.type.startsWith('audio/')?'audio':'image'}if(file.type.startsWith('image/')){dz.innerHTML='<img src="'+d.url+'" style="max-width:100%;max-height:40px;border-radius:4px">'}dz.classList.add('has-file');renderRound(r)}
async function upFinal(i,type,input){var file=input.files[0];if(!file)return;var dz=input.previousElementSibling;dz.textContent='Uploading...';var fd=new FormData();fd.append('file',file);var resp=await fetch('/api/upload',{method:'POST',body:fd});var d=await resp.json();if(type==='q'){T.final[i].qmedia=d.url;T.final[i].qmediatype=file.type.startsWith('audio/')?'audio':'image'}else{T.final[i].amedia=d.url;T.final[i].amediatype=file.type.startsWith('audio/')?'audio':'image'}if(file.type.startsWith('image/')){dz.innerHTML='<img src="'+d.url+'" style="max-width:100%;max-height:40px;border-radius:4px">'}dz.classList.add('has-file');renderRound(3)}

async function loadDrafts() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('drafts-screen').style.display = 'flex';

  var r = await fetch('/api/drafts');
  var d = await r.json();
  var h = '';

  if (!d.drafts || !d.drafts.length) {
    h = '<p class="empty-drafts">Черновиков нет</p>';
  } else {
    for (var x of d.drafts) {
      h += `
        <div class="draft-card-wrapper">
          <button class="draft-card"
                  type="button"
                  onclick="openDraft('${x.id}')">
            ${x.name}
          </button>
          <button class="draft-delete-btn"
                  type="button"
                  onclick="deleteDraft(event, '${x.id}')"
                  title="Удалить черновик">
            ×
          </button>
        </div>
      `;
    }
  }

  document.getElementById('drafts-list').innerHTML = h;
}

async function deleteDraft(event, id) {
  // Останавливаем всплытие события
  event.stopPropagation();
  event.preventDefault();

  // Подтверждение удаления
  if (!confirm('Удалить этот черновик?')) {
    return;
  }

  try {
    const response = await fetch('/api/draft/delete', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ id: id })
    });

    const result = await response.json();

    if (response.ok && result.success) {
      // Перезагружаем список черновиков
      await loadDrafts();
    } else {
      alert('Не удалось удалить черновик: ' + (result.message || 'неизвестная ошибка'));
    }
  } catch (error) {
    console.error('Ошибка удаления черновика:', error);
    alert('Ошибка удаления черновика');
  }
}

async function getLocalIP() {
  try {
    const response = await fetch('/api/local_ip');
    if (response.ok) {
      const data = await response.json();
      return data.ip;
    }
  } catch (e) {
    console.error('Ошибка получения IP:', e);
  }
  return null;
}

async function updateLobbyIP() {
  const ip = await getLocalIP();
  if (ip) {
    document.getElementById('lobby-ip').innerHTML = `<b>http://${ip}:8000/player.html</b>`;
  } else {
    // Fallback на window.location.hostname
    let fallbackIP = window.location.hostname;
    if (fallbackIP === 'localhost' || fallbackIP === '127.0.0.1') {
      fallbackIP = '127.0.0.1';
    }
    document.getElementById('lobby-ip').innerHTML = `<b>http://${fallbackIP}:8000/player.html</b>`;
  }
}
// Функция для inline-редактирования очков игрока
function editPlayerScore(playerId) {
    if (!window._gameState || !window._gameState.players) {
        console.error('Нет данных об игроках');
        return;
    }

    var players = window._gameState.players;
    var playerName = '';
    var currentScore = 0;
    var actualPlayerId = playerId;

    // Находим имя и текущий счет игрока
    if (players[playerId] && players[playerId].name) {
        playerName = players[playerId].name;
        currentScore = players[playerId].score || 0;
    } else {
        // Ищем по имени
        for (var id in players) {
            if (players[id].name === playerId) {
                playerName = players[id].name;
                currentScore = players[id].score || 0;
                actualPlayerId = id;
                break;
            }
        }
    }

    if (!playerName) {
        console.error('Игрок не найден:', playerId);
        return;
    }

    // Находим элемент счета в DOM
    var scoreElements = document.querySelectorAll('.player-badge .pscore');
    var targetElement = null;

    for (var i = 0; i < scoreElements.length; i++) {
        var el = scoreElements[i];
        var parentBadge = el.closest('.player-badge');
        var nameElement = parentBadge ? parentBadge.querySelector('.pname') : null;

        if (nameElement && nameElement.textContent === playerName) {
            targetElement = el;
            break;
        }
    }

    if (!targetElement) {
        console.error('Элемент счета не найден для игрока:', playerName);
        return;
    }

    // Если уже редактируется, не создаем новое поле
    if (targetElement.classList.contains('editing')) {
        return;
    }

    // Сохраняем текущее значение
    var originalScore = currentScore;

    // Делаем элемент редактируемым
    targetElement.classList.add('editing');
    targetElement.setAttribute('contenteditable', 'true');
    targetElement.textContent = originalScore;

    // Фокусируемся и выделяем текст
    var range = document.createRange();
    var selection = window.getSelection();
    range.selectNodeContents(targetElement);
    selection.removeAllRanges();
    selection.addRange(range);
    targetElement.focus();

    // Обработчик завершения редактирования
    function finishEditing(save) {
        targetElement.classList.remove('editing');
        targetElement.setAttribute('contenteditable', 'false');
        targetElement.removeEventListener('blur', onBlur);
        targetElement.removeEventListener('keydown', onKeyDown);

        if (!save) {
            // Восстанавливаем исходное значение
            targetElement.textContent = originalScore;
            return;
        }

                var newScore = parseInt(targetElement.textContent.trim());

        if (isNaN(newScore)) {
            targetElement.textContent = originalScore;
            return;
        }

        // Вычисляем разницу
        var delta = newScore - originalScore;

        if (delta !== 0) {
            // Отправляем изменение на сервер
            changePlayerScore(actualPlayerId, delta);

            // Обновляем локальное состояние
            if (window._gameState && window._gameState.players) {
                var players = window._gameState.players;
                if (players[actualPlayerId]) {
                    players[actualPlayerId].score = newScore;
                } else {
                    // Ищем по имени
                    for (var pid in players) {
                        if (players[pid].name === playerName) {
                            players[pid].score = newScore;
                            break;
                        }
                    }
                }
            }

            // Обновляем отображение
            targetElement.textContent = newScore;
        } else {
            targetElement.textContent = originalScore;
        }
    }

    function onBlur() {
        finishEditing(true);
    }

    function onKeyDown(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            finishEditing(true);
        } else if (e.key === 'Escape') {
            e.preventDefault();
            finishEditing(false);
        }
    }

    targetElement.addEventListener('blur', onBlur);
    targetElement.addEventListener('keydown', onKeyDown);
}
// Функция для изменения очков игрока
function changePlayerScore(playerId, delta) {
    if (!window.ws || window.ws.readyState !== WebSocket.OPEN) {
        console.error('WebSocket not open');
        return;
    }

    // Находим имя игрока
    let playerName = '';
    if (window._gameState && window._gameState.players) {
        const players = window._gameState.players;
        if (players[playerId] && players[playerId].name) {
            playerName = players[playerId].name;
        } else {
            for (var id in players) {
                if (id === playerId && players[id].name) {
                    playerName = players[id].name;
                    break;
                }
            }
        }
    }

    console.log('[changePlayerScore] sending', playerId, delta);
    window.ws.send(JSON.stringify({ type: 'adjust_score', player_id: playerId, delta: delta }));

    // Показываем сообщение об изменении очков
    var ansname = document.getElementById('ansname');
    if (ansname && playerName) {
        var sign = delta > 0 ? '+' : '';
        var color = delta > 0 ? '#167d55' : '#e95d4f';

        // Очищаем ВСЕ предыдущие таймеры
        if (window._selectionTimeout) {
            clearTimeout(window._selectionTimeout);
            window._selectionTimeout = null;
        }
        if (window._scoreMessageTimeout) {
            clearTimeout(window._scoreMessageTimeout);
        }

        // Устанавливаем флаг, чтобы renderGame не стирал сообщение
        window._showScoreMessage = true;

            // Вся надпись одного цвета
    var absDelta = Math.abs(delta);
    var messageText = 'Игрок ' + playerName + ' ' +
                     (delta > 0 ? 'получил' : 'потерял') + ' ' +
                     absDelta + ' очков';

        window._scoreMessageHTML = '<span style="color:' + color + ';font-weight:900;">' +
                                   messageText + '</span>';

        ansname.innerHTML = window._scoreMessageHTML;

        // Через 3 секунды очищаем сообщение
        window._scoreMessageTimeout = setTimeout(function() {
            window._showScoreMessage = false;
            window._scoreMessageHTML = '';
            ansname.textContent = '';
            ansname.style.color = '';
        }, 3000);
    }
}
// Функция для получения списка игроков (без ведущего)
function getPlayersList() {
    if (!window._gameState || !window._gameState.players) return [];

    var players = [];

    // Перебираем всех игроков из _gameState.players
    for (var id in window._gameState.players) {
        var p = window._gameState.players[id];

        // Пропускаем ведущего
        if (p.is_host === true || p.isHost === true) {
            continue;
        }

        // Проверяем, не является ли это имя именем ведущего
        var hostName = window._gameState.host_name ||
                       document.getElementById('hname-display')?.textContent || '';

        if (hostName && p.name === hostName) {
            continue;
        }

        players.push({
            id: id,  // ID игрока - это ключ объекта
            name: p.name,
            score: p.score || 0
        });
    }

    return players;
}
// Функция для отображения подсказки
function showScoreHint() {
    var players = getPlayersList();
    if (!players.length) return;

    var hint = 'Выберите игрока (1-' + players.length + '):\n';
    players.forEach(function(p, i) {
        hint += (i + 1) + '. ' + p.name + ' (' + p.score + ')\n';
    });
    hint += '\nЗатем:\n+ - добавить очки\n- - снять очки\nEsc - отмена';

    alert(hint);
}

// Обработчик клавиатуры
document.addEventListener('keydown', function(e) {
    // Игнорируем если фокус в input или textarea
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        return;
    }

    // Если игра не запущена
    if (!window._gameState || !window._gameState.game) {
        return;
    }

    var players = getPlayersList();
    if (!players.length) return;

    // Клавиша 'S' - показать подсказку
    if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') {
        showScoreHint();
        return;
    }

    // Цифры 1-5 для выбора игрока
        // Цифры 1-5 для выбора игрока
    if (e.key >= '1' && e.key <= '5') {
        selectedPlayerIndex = parseInt(e.key) - 1;
        if (selectedPlayerIndex < players.length) {
            keyboardMode = true;
            console.log('Выбран игрок:', players[selectedPlayerIndex].name);

            var ansname = document.getElementById('ansname');
            if (ansname) {
                // Очищаем ВСЕ предыдущие таймеры
                if (window._scoreMessageTimeout) {
                    clearTimeout(window._scoreMessageTimeout);
                    window._scoreMessageTimeout = null;
                }
                if (window._selectionTimeout) {
                    clearTimeout(window._selectionTimeout);
                }

                // Сбрасываем флаг сообщения об очках
                window._showScoreMessage = false;
                window._scoreMessageHTML = '';

                ansname.textContent = 'Выбран: ' + players[selectedPlayerIndex].name;
                ansname.style.color = '#ff9800'; // Оранжевый цвет для "Выбран"
                ansname.style.fontWeight = 'bold';

                // Через 3 секунды убираем надпись
                window._selectionTimeout = setTimeout(function() {
                    if (keyboardMode && selectedPlayerIndex >= 0 && selectedPlayerIndex < players.length) {
                        ansname.textContent = '';
                        ansname.style.color = '';
                    }
                }, 3000);
            }
        }
        return;
    }

    // Если выбран игрок
    if (keyboardMode && selectedPlayerIndex >= 0 && selectedPlayerIndex < players.length) {
        // Клавиша '+' или '=' для добавления очков
        if (e.key === '+' || e.key === '=') {
            e.preventDefault();
            var amount = prompt('Сколько очков добавить игроку ' + players[selectedPlayerIndex].name + '?');
            if (amount !== null) {
                var delta = parseInt(amount) || 0;
                if (delta > 0) {
                    changePlayerScore(players[selectedPlayerIndex].id, delta);
                    console.log('Добавлено ' + delta + ' очков игроку ' + players[selectedPlayerIndex].name);
                }
            }
            return;
        }

        // Клавиша '-' для снятия очков
        if (e.key === '-' || e.key === '_') {
            e.preventDefault();
            var amount = prompt('Сколько очков снять у игрока ' + players[selectedPlayerIndex].name + '?');
            if (amount !== null) {
                var delta = parseInt(amount) || 0;
                if (delta > 0) {
                    changePlayerScore(players[selectedPlayerIndex].id, -delta);
                    console.log('Снято ' + delta + ' очков у игрока ' + players[selectedPlayerIndex].name);
                }
            }
            return;
        }

        // Esc - отмена
        if (e.key === 'Escape') {
            keyboardMode = false;
            selectedPlayerIndex = -1;

            // Очищаем таймер выбора
            if (window._selectionTimeout) {
                clearTimeout(window._selectionTimeout);
            }

            var ansname = document.getElementById('ansname');
            if (ansname) {
                ansname.textContent = '';
                ansname.style.color = '';
            }
            console.log('Отмена');
            return;
        }
    }
});

async function startGame() {
  const gameNameInput = document.querySelector('#editor-screen .sidebar-input#gameName') || document.getElementById('gameName');
  const hostNameInput = document.querySelector('#editor-screen .sidebar-input#hostName') || document.getElementById('hostName');

  if (!gameNameInput || !hostNameInput) {
    alert('Не найдены поля «Название игры» или «Имя ведущего».');
    return;
  }

  try {
    T.name = gameNameInput.value.trim() || 'Моя игра';

    const roomResponse = await fetch('/api/create_room', {
      method: 'POST'
    });

    if (!roomResponse.ok) {
      throw new Error(`Не удалось создать комнату: ${roomResponse.status}`);
    }

    const roomData = await roomResponse.json();
    roomCode = roomData.room_code;

    if (!roomCode) {
      throw new Error('Сервер не вернул код комнаты.');
    }

    console.log('✅ roomCode получен:', roomCode);

    // ====== ПОКАЗЫВАЕМ ЛОББИ СРАЗУ ======
    document.getElementById('editor-screen').style.display = 'none';
document.getElementById('lobby-screen').style.display = 'block';

    // ✅ ЯВНО УСТАНАВЛИВАЕМ ЗНАЧЕНИЯ
    document.getElementById('rcodebig').textContent = roomCode;
    console.log('✅ Код комнаты установлен (startGame):', roomCode);

    updateLobbyIP();

    const templateResponse = await fetch(
      `/api/save_template/${roomCode}`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(T)
      }
    );

    if (!templateResponse.ok) {
      throw new Error(`Не удалось сохранить шаблон: ${templateResponse.status}`);
    }

    playerId = Math.random().toString(36).slice(2, 10);

    // ✅ ИСПРАВЛЕННЫЙ WebSocket URL (как в рабочей версии)
    window.ws = new WebSocket(`ws://${window.location.hostname}:8000/ws/${roomCode}/${playerId}`);

    window.ws.onopen = function () {
      window.ws.send(JSON.stringify({
        type: 'join',
        name: hostNameInput.value.trim() || 'Ведущий'
      }));
      joined = false;
    };

    window.ws.onerror = function () {
      alert('Не удалось установить соединение с сервером игры.');
    };

    window.ws.onmessage = function (event) {
      const msg = JSON.parse(event.data);
      console.log('Сообщение сервера:', msg);

      if (msg.type === 'room_state' || msg.type === 'roomstate') {
        if (!joined) {
          console.log('Отправляем set_creator...');
          window.ws.send(JSON.stringify({
            type: 'set_creator'
          }));
          joined = true;
          return;
        }

        // ✅ ОБНОВЛЯЕМ ЛОББИ
        updateLobby(msg);
        return;
      }
    if (msg.type === 'score_updated' || msg.type === 'scoreupdate') {
        if (window._gameState) {
            // Обновляем очки в _gameState.players
            if (msg.players && window._gameState.players) {
                for (var pid in msg.players) {
                    if (window._gameState.players[pid]) {
                        window._gameState.players[pid].score = msg.players[pid].score;
                    }
                }
            }
            // Перерисовываем игру
            renderGame(window._gameState);
        }
        return;
    }

      if (msg.type === 'game_state' || msg.type === 'gamestate') {
        const phase = msg.game?.phase;

        if (phase === 'finished') return;

        if (phase !== 'playing' && phase !== 'final') {
          updateLobby(msg);
          return;
        }

        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('game-room-code').textContent = roomCode;
        renderGame(msg);
        return;
      }

      if (msg.type === 'final_scores' || msg.type === 'finalscores') {
  showFinalResults(msg.scores || msg.final_scores || {});
  return;
}

      if (msg.type === 'final_update' || msg.type === 'finalupdate') {
  updateFinalOverlay(msg);
  return;
}
    };
  } catch (error) {
    console.error(error);
    alert(`Ошибка запуска игры: ${error.message}`);
  }
}

function updateLobby(msg) {
  console.log('🔄 updateLobby вызвана', msg);

  // ✅ Убеждаемся, что лобби видно
document.getElementById('lobby-screen').style.display = 'block';
  if (roomCode) {
    document.getElementById('lobby-players-count').textContent =
    msg.players_count ?? Object.keys(msg.players || {}).length;
    document.getElementById('rcodebig').textContent = roomCode;
  }

  updateLobbyIP();

  const slots = document.querySelectorAll('.player-slot');
  const names = [];

  for (const id in msg.players) {
    const player = msg.players[id];
    if (!player.is_host) {
      names.push(player.name);
    }
  }

  console.log('👥 Игроки в лобби:', names);

  for (let i = 0; i < slots.length; i++) {
    if (names[i]) {
      slots[i].textContent = names[i];
      slots[i].style.background = '#f5deb3';
      slots[i].style.color = '#1a1a2e';
    } else {
      slots[i].textContent = 'Empty';
      slots[i].style.background = '#2a2a4a';
      slots[i].style.color = '#888';
    }
  }

  document.getElementById('btn-start-game').style.display = 'inline-block';
}

function evalA(correct) {
  if (correct) {
    isFirstQuestion = false;
    const game = window._gameState && window._gameState.game;
    const players = window._gameState && window._gameState.players;

    const rawAnsweringName =
      (game && game.answering_name) ||
      (game && game.answeringname) ||
      window.lastAnsweringPlayerName ||
      '';

    // Преобразуем ID в имя
    let answeringName = rawAnsweringName;

    if (players) {
      // Ищем игрока по ID
      if (players[rawAnsweringName] && players[rawAnsweringName].name) {
        answeringName = players[rawAnsweringName].name;
      } else {
        // Ищем по имени
        for (var id in players) {
          if (players[id].name === rawAnsweringName) {
            answeringName = rawAnsweringName;
            break;
          }
        }
      }
    }

    if (answeringName && answeringName !== 'Ведущий') {
      lastCorrectPlayerName = answeringName;

      const playersRow = document.getElementById('gplayers');
      if (playersRow) {
        playersRow.setAttribute(
          'data-selector-name',
          lastCorrectPlayerName
        );
      }
    }
  }

  if (!window.ws || window.ws.readyState !== WebSocket.OPEN) {
    console.error('WebSocket не подключён');
    return;
  }

  window.ws.send(JSON.stringify({
    type: 'evaluate_answer',
    correct: correct
  }));
}

function updateFinalOverlay(msg) {
  if (!window._gameState || !window._gameState.game) return;

  var game = window._gameState.game;

  var incomingBets =
    msg.final_bets ??
    msg.finalbets ??
    game.final_bets ??
    game.finalbets ??
    {};

  var incomingAnswers =
    msg.final_answers ??
    msg.finalanswers ??
    game.final_answers ??
    game.finalanswers ??
    {};

  game.final_bets = incomingBets;
  game.final_answers = incomingAnswers;

  var status = document.getElementById('final-status');
  if (!status) return;

  var players = msg.players || window._gameState.players || {};
  var html = '<div class="final-status-list">';

  for (var id in players) {
    var player = players[id];

    // Пропускаем ведущего (все возможные способы определения)
    if (
      player.is_host === true ||
      player.isHost === true ||
      player.role === 'host' ||
      player.role === 'ведущий' ||
      player.name === msg.host_name ||
      player.name === window._gameState.host_name ||
      player.name === document.getElementById('hname-display')?.textContent
    ) {
      continue;
    }

    var rawBet =
      incomingBets[id] ??
      incomingBets[player.id] ??
      incomingBets[player.name] ??
      player.final_bet ??
      player.bet ??
      null;

    var rawAnswer =
      incomingAnswers[id] ??
      incomingAnswers[player.id] ??
      incomingAnswers[player.name] ??
      player.final_answer ??
      player.answer ??
      null;

    var bet = rawBet;
    if (rawBet && typeof rawBet === 'object') {
      bet =
        rawBet.amount ??
        rawBet.bet_amount ??
        rawBet.bet ??
        rawBet.value ??
        rawBet.sum ??
        '';
    }

    var answer = rawAnswer;
    if (rawAnswer && typeof rawAnswer === 'object') {
      answer =
        rawAnswer.text ??
        rawAnswer.answer_text ??
        rawAnswer.answer ??
        rawAnswer.value ??
        '';
    }

    var hasBet =
      player.has_bet === true ||
      player.hasbet === true ||
      bet !== null && bet !== undefined && bet !== '';

    var hasAnswered =
      player.has_answered === true ||
      player.hasanswered === true ||
      answer !== null && answer !== undefined && answer !== '';

    var betText = hasBet
      ? 'Ставка сделана'
      : 'Ожидание ставки...';

    var answerText = hasAnswered
      ? 'Ответ получен'
      : 'Ожидание ответа...';

    html +=
      '<div class="final-player-status">' +
        '<div class="final-player-name">' +
          escapeFinalHtml(player.name || 'Игрок') +
        '</div>' +
        '<div class="final-player-bet">' + betText + '</div>' +
        '<div class="final-player-answer">' + answerText + '</div>' +
      '</div>';
  }

  html += '</div>';
  status.innerHTML = html;
}
